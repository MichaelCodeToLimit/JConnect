name: Windows beta release

# Publishes the Windows installer that the website serves as a GitHub pre-release.
# To publish another build, change the values under env, add its notes under .github/releases and push.
on:
  push:
    branches: [app]
    paths:
      - .github/workflows/release-windows.yml
      - .github/releases/**
  workflow_dispatch:

permissions:
  contents: write

env:
  TAG: v0.1.0-beta.1
  TITLE: JConnect 0.1.0 Beta 1 for Windows
  ASSET: JConnect-Setup-0.1.0-beta.1.exe
  # The commit the installer was built from, and the installer's SHA-256.
  TARGET: 04498c15e00da2a42a0e1e351838aa9a316a5691
  SHA256: b4b5eb13a4c984ed0fb925eed86903ad8c7bd195b09fdd7c4e0b7bce534c76e1

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Publish the Windows beta
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Take the installer from the website branch
        run: |
          mkdir -p ci-logs release
          git fetch --depth=1 origin main 2>&1 | tee ci-logs/1-installer.log
          git show FETCH_HEAD:public/download/JConnect-Setup.exe > "release/$ASSET"
          ls -l "release/$ASSET" | tee -a ci-logs/1-installer.log
          echo "$SHA256  release/$ASSET" | sha256sum --check 2>&1 | tee -a ci-logs/1-installer.log
          (cd release && sha256sum "$ASSET" > SHA256SUMS.txt)

      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "$TAG is already published." | tee ci-logs/2-release.log
          else
            gh release create "$TAG" "release/$ASSET" release/SHA256SUMS.txt \
              --target "$TARGET" --prerelease --title "$TITLE" \
              --notes-file ".github/releases/$TAG.md" 2>&1 | tee ci-logs/2-release.log
          fi
          gh release view "$TAG" --json tagName,name,isPrerelease,url,createdAt,assets \
            --jq '{tag: .tagName, name, prerelease: .isPrerelease, url, createdAt, assets: [.assets[] | {name, size}]}' 2>&1 | tee ci-logs/3-release-view.log

      # Logs go to a branch too, so they can be read with plain git.
      - name: Publish logs to the ci/windows-release branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ job.status }}
        run: |
          mkdir -p ci-logs
          {
            echo "status: $STATUS"
            echo "commit: $GITHUB_SHA"
            echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > ci-logs/summary.txt
          cd ci-logs
          git init -q -b ci/windows-release
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Windows release $TAG: $STATUS"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci/windows-release
