name: Updater check

# Builds an older and a newer Windows installer, installs the older one, and checks that JConnect updates itself to the
# newer one from an update server on the runner and starts again. Runs when the updater branch is pushed, or by hand.
on:
  push:
    branches: [updater]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-check-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  windows:
    name: A Windows install updates itself
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run the updater tests
        run: |
          mkdir -p ci-logs
          npm ci > ci-logs/1-install.log 2>&1
          node --test test/updater.test.js 2>&1 | tee ci-logs/2-tests.log

      - name: Build an older and a newer installer
        run: |
          node scripts/make-icons.js
          npx electron-builder --win nsis --x64 -c.extraMetadata.version=0.0.1-test.1 -c.directories.output=dist-old > ci-logs/3-build-old.log 2>&1
          npx electron-builder --win nsis --x64 -c.extraMetadata.version=0.0.1-test.2 -c.directories.output=dist-new > ci-logs/4-build-new.log 2>&1
          ls -l dist-old/*.exe dist-new/*.exe | tee -a ci-logs/4-build-new.log

      - name: Let the older JConnect update itself
        timeout-minutes: 15
        run: >-
          node scripts/windows-update-check.js dist-old/JConnect-Setup-0.0.1-test.1.exe
          dist-new/JConnect-Setup-0.0.1-test.2.exe 0.0.1-test.2 ci-logs

      # Logs go to a branch too, so they can be read with plain git.
      - name: Publish logs to the ci/updater branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ job.status }}
        run: |
          mkdir -p ci-logs
          {
            echo "status: $STATUS"
            echo "commit: $GITHUB_SHA"
            echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > ci-logs/summary.txt
          cd ci-logs
          git init -q -b ci/updater
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Updater check $GITHUB_RUN_NUMBER: $STATUS"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci/updater
