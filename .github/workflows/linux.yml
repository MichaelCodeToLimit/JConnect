name: Linux build

# Builds the AppImage and .deb and checks them on Ubuntu. On the app branch, a build that passes is published as a
# GitHub pre-release once TAG has release notes under .github/releases. To publish another build, change TAG and TITLE,
# add its notes and push. The linux branch is for trying changes without starting the macOS build.
on:
  push:
    branches: [app, linux]
    paths:
      - src/**
      - native/**
      - assets/**
      - build/**
      - scripts/**
      - package.json
      - package-lock.json
      - .github/workflows/linux.yml
      - .github/releases/linux-*
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

env:
  TAG: linux-v0.1.0-beta.2
  TITLE: JConnect 0.1.0 Beta 2 for Linux

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build and check the Linux packages
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install the tools for the checks
        run: |
          mkdir -p ci-logs
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb x11-utils imagemagick > /dev/null
          { lsb_release -ds; uname -r; node -v; } 2>&1 | tee ci-logs/0-runner.log

      - name: Install dependencies
        run: npm ci 2>&1 | tee ci-logs/1-install.log

      - name: Run tests
        run: >-
          node --test test/secure-channel.test.js test/jvpn.test.js test/account.test.js test/forticlient.test.js test/updater.test.js test/local-cloud.test.js
          src/web/test/connection.test.js src/web/test/tv.test.js server/cloud/test/cloud.test.js server/cloud/test/store.test.js 2>&1 | tee ci-logs/2-tests.log

      # Ubuntu 20.04 has an older glibc (2.31) than current distributions, so a helper built there also runs on older ones.
      - name: Build the input helper on Ubuntu 20.04
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e HOST_ID="$(id -u):$(id -g)" -e DEBIAN_FRONTEND=noninteractive ubuntu:20.04 bash -c '
            set -e
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends gcc libc6-dev libx11-dev libxtst-dev nodejs > /dev/null
            node scripts/build-linux-input.js
            chown -R "$HOST_ID" build
          ' 2>&1 | tee ci-logs/3-helper.log

      - name: Build the AppImage and .deb
        run: |
          node scripts/make-icons.js
          # The app reports the version it's released as, which its updater compares with the website's.
          npx electron-builder --linux -c.extraMetadata.version="${TAG#linux-v}" 2>&1 | tee ci-logs/4-build.log

      # Upload first, so the packages are kept even if a check below fails.
      - name: Upload the packages
        uses: actions/upload-artifact@v4
        with:
          name: JConnect-Linux
          path: |
            dist/*.AppImage
            dist/*.deb
          compression-level: 0
          if-no-files-found: error

      - name: Check the packages
        timeout-minutes: 20
        run: bash scripts/linux-smoke-test.sh ci-logs 2>&1 | tee ci-logs/5-check.log

      # Logs go to a branch too, so they can be read with plain git.
      - name: Publish logs to the ci/linux branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ job.status }}
        run: |
          mkdir -p ci-logs
          {
            echo "status: $STATUS"
            echo "branch: $GITHUB_REF_NAME"
            echo "commit: $GITHUB_SHA"
            echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            ls -l dist/*.AppImage dist/*.deb 2> /dev/null || echo "no packages were built"
            sha256sum dist/*.AppImage dist/*.deb 2> /dev/null || true
          } > ci-logs/summary.txt
          cd ci-logs
          git init -q -b ci/linux
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Linux build $GITHUB_RUN_NUMBER on $GITHUB_REF_NAME: $STATUS"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci/linux

  release:
    name: Publish the Linux beta
    needs: build
    if: github.ref == 'refs/heads/app'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: JConnect-Linux
          path: dist

      - name: Create the pre-release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p ci-logs release
          notes=".github/releases/$TAG.md"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "$TAG is already published." | tee ci-logs/1-release.log
          elif [ ! -f "$notes" ]; then
            echo "$notes doesn't exist, so nothing was published." | tee ci-logs/1-release.log
          else
            version="${TAG#linux-v}"
            cp dist/*.AppImage "release/JConnect-$version-x86_64.AppImage"
            cp dist/*.deb "release/JConnect-$version-amd64.deb"
            (cd release && sha256sum JConnect-* > SHA256SUMS.txt && cat SHA256SUMS.txt) 2>&1 | tee ci-logs/1-release.log
            gh release create "$TAG" release/* --target "$GITHUB_SHA" --prerelease --title "$TITLE" \
              --notes-file "$notes" 2>&1 | tee -a ci-logs/1-release.log
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
          (gh release view "$TAG" --json tagName,name,isPrerelease,url,assets \
            --jq '{tag: .tagName, name, prerelease: .isPrerelease, url, assets: [.assets[] | {name, size}]}' || true) 2>&1 | tee ci-logs/2-release-view.log

      # The website offers the .deb too. It goes on the main branch, which Render publishes.
      - name: Put the .deb on the website
        if: steps.release.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone -q --depth 1 --branch main "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" website
          cp release/*.deb website/public/download/JConnect-Linux.deb
          cd website/public/download
          sha256sum JConnect-Linux.deb > JConnect-Linux.deb.sha256
          # What JConnect's updater reads to find this version.
          node "$GITHUB_WORKSPACE/scripts/update-info.js" JConnect-Linux.deb "${TAG#linux-v}"
          git add JConnect-Linux.deb JConnect-Linux.deb.sha256 JConnect-Linux.deb.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Offer the .deb from $TITLE for download"
          git push -q origin main
          { ls -l JConnect-Linux.deb; cat JConnect-Linux.deb.sha256; } 2>&1 | tee "$GITHUB_WORKSPACE/ci-logs/3-website.log"

      - name: Publish logs to the ci/linux-release branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ job.status }}
        run: |
          mkdir -p ci-logs
          {
            echo "status: $STATUS"
            echo "commit: $GITHUB_SHA"
            echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > ci-logs/summary.txt
          cd ci-logs
          git init -q -b ci/linux-release
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Linux release $TAG: $STATUS"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci/linux-release
