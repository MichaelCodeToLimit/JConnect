name: macOS build

on:
  push:
    branches: [app]
    # Only changes to the desktop app start a macOS build, because macOS minutes cost ten times as much.
    paths:
      - src/**
      - native/**
      - assets/**
      - build/**
      - scripts/**
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  dmg:
    name: Build and check the DMGs
    # Icon Composer icons only compile on macOS 26 or later.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Icon Composer icons need Xcode 26 or later, so pick the newest release Xcode on the runner.
      - name: Use the newest Xcode
        run: |
          mkdir -p ci-logs
          newest="$(ls -d /Applications/Xcode_*.app 2> /dev/null | grep -v -i -E 'beta|rc' | sort -V | tail -1)"
          if [ -n "$newest" ]; then sudo xcode-select -s "$newest/Contents/Developer"; fi
          {
            sw_vers
            ls -d /Applications/Xcode*.app
            xcodebuild -version
            xcrun swiftc --version
            xcrun actool --version | grep -A1 short-bundle-version
          } 2>&1 | tee ci-logs/0-runner.log

      - name: Install dependencies
        run: npm ci 2>&1 | tee ci-logs/1-install.log

      - name: Run tests
        run: >-
          node --test test/secure-channel.test.js test/jvpn.test.js test/account.test.js test/forticlient.test.js
          src/web/test/connection.test.js server/cloud/test/cloud.test.js 2>&1 | tee ci-logs/2-tests.log

      - name: Build the DMGs
        run: npm run dist:mac 2>&1 | tee ci-logs/3-build.log

      # Upload first, so the DMGs are kept even if a check below fails.
      - name: Upload the DMGs
        uses: actions/upload-artifact@v4
        with:
          name: JConnect-macOS
          path: dist/*.dmg
          compression-level: 0
          if-no-files-found: error

      - name: Check the DMGs
        timeout-minutes: 15
        run: bash scripts/mac-smoke-test.sh ci-logs 2>&1 | tee ci-logs/4-check.log

      # Logs go to a branch too, so they can be read with plain git.
      - name: Publish logs to the ci/mac branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ job.status }}
        run: |
          mkdir -p ci-logs
          {
            echo "status: $STATUS"
            echo "commit: $GITHUB_SHA"
            echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            ls -l dist/*.dmg 2> /dev/null || echo "no DMGs were built"
            shasum -a 256 dist/*.dmg 2> /dev/null || true
          } > ci-logs/summary.txt
          cp dist/icon-preview.png ci-logs/ 2> /dev/null || true
          cd ci-logs
          git init -q -b ci/mac
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "macOS build $GITHUB_RUN_NUMBER: $STATUS"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci/mac
