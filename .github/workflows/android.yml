name: Android build

on:
  push:
    branches: [app]
    paths:
      - mobile/**
      - src/web/**
      - src/shared/secure-channel.js
      - .github/workflows/android.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  apk:
    name: Build and check the APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build the APK
        run: |
          mkdir -p ci-logs
          cd mobile
          npm ci 2>&1 | tee ../ci-logs/1-install.log
          npm run sync 2>&1 | tee ../ci-logs/2-sync.log
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1 | tee ../../ci-logs/3-build.log
          cp app/build/outputs/apk/debug/app-debug.apk ../../JConnect-android.apk

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: JConnect-android
          path: JConnect-android.apk
          if-no-files-found: error

      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start JConnect on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash mobile/scripts/emulator-check.sh JConnect-android.apk ci-logs 2>&1 | tee ci-logs/4-emulator.log

      # Logs go to a branch too, so they can be read with plain git.
      - name: Publish logs to the ci/android branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ job.status }}
        run: |
          mkdir -p ci-logs
          {
            echo "status: $STATUS"
            echo "commit: $GITHUB_SHA"
            echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            ls -l JConnect-android.apk 2> /dev/null || echo "no APK was built"
            sha256sum JConnect-android.apk 2> /dev/null || true
          } > ci-logs/summary.txt
          cd ci-logs
          git init -q -b ci/android
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Android build $GITHUB_RUN_NUMBER: $STATUS"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci/android
