name: Android build

on:
  push:
    # The android branch is for trying Android changes without starting the desktop builds.
    branches: [app, android]
    paths:
      - mobile/**
      - src/web/**
      - src/shared/secure-channel.js
      - .github/workflows/android.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  apk:
    name: Build and check the APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build the APK
        run: |
          mkdir -p ci-logs
          cd mobile
          npm ci 2>&1 | tee ../ci-logs/1-install.log
          npm run sync 2>&1 | tee ../ci-logs/2-sync.log
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1 | tee ../../ci-logs/3-build.log
          cp app/build/outputs/apk/debug/app-debug.apk ../../JConnect-android.apk

      # One APK for phones, tablets and TVs. Android TV only offers apps that have a TV home screen activity and
      # don't require a touchscreen, a camera or Wi-Fi (many TV boxes only have Ethernet).
      - name: Check that TVs can install the APK
        run: |
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)aapt2"
          "$aapt2" dump badging JConnect-android.apk > ci-logs/3-tv-badging.log
          grep -E "launchable|uses-feature|uses-implied-feature" ci-logs/3-tv-badging.log
          grep -q "^leanback-launchable-activity:" ci-logs/3-tv-badging.log || { echo "::error::The APK has no activity for the Android TV home screen"; exit 1; }
          if grep -E "^uses-feature: name='android\.hardware\.(touchscreen|camera|wifi)" ci-logs/3-tv-badging.log; then
            echo "::error::The APK requires a touchscreen, a camera or Wi-Fi, so some TVs can't install it"
            exit 1
          fi

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: JConnect-android
          path: JConnect-android.apk
          if-no-files-found: error

      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start an Android emulator
        timeout-minutes: 15
        run: bash mobile/scripts/emulator-boot.sh 34 2>&1 | tee ci-logs/4-emulator-boot.log

      - name: Check JConnect on the emulator
        timeout-minutes: 5
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          bash mobile/scripts/emulator-check.sh JConnect-android.apk ci-logs 2>&1 | tee ci-logs/8-check.log

      # Logs go to a branch too, so they can be read with plain git.
      - name: Publish logs to the ci/android branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ job.status }}
        run: |
          mkdir -p ci-logs
          {
            echo "status: $STATUS"
            echo "commit: $GITHUB_SHA"
            echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            ls -l JConnect-android.apk 2> /dev/null || echo "no APK was built"
            sha256sum JConnect-android.apk 2> /dev/null || true
          } > ci-logs/summary.txt
          cp emulator.log sdkmanager.log ci-logs/ 2> /dev/null || true
          cd ci-logs
          git init -q -b ci/android
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Android build $GITHUB_RUN_NUMBER: $STATUS"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci/android
