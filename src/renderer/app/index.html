<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src ws: wss:">
  <title>JConnect</title>
  <link rel="stylesheet" href="../../shared/theme.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="top">
    <div class="brand"><img src="../../../assets/icon.png" alt="" width="26" height="26"><span>JConnect</span></div>
    <div class="top-actions">
      <button class="icon-btn account-btn" id="account-btn" type="button" aria-label="Account" title="Account">👤</button>
      <button class="icon-btn" id="settings-btn" type="button" aria-label="Settings" title="Settings">⚙</button>
      <button class="icon-btn power-btn" id="power-btn" type="button" aria-label="Stop" title="Terminate JConnect or shut down this computer">⏻</button>
    </div>
  </header>
  <main id="home"><div class="spinner"></div></main>
  <footer id="footer"></footer>
  <div id="toast" class="toast" role="status" hidden></div>
  <script src="../../web/vendor/nacl-fast.min.js"></script>
  <script src="../../shared/secure-channel.js"></script>
  <script src="../../shared/protocol.js"></script>
  <script src="app.js"></script>

</html>
