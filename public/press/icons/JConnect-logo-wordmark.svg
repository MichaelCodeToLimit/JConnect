<svg xmlns="http://www.w3.org/2000/svg" width="480" height="160" viewBox="0 0 480 160">
  <!-- Email signature logo. Transparent, with colours that read on both light and dark mail backgrounds. Shown at 240x80. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6bff"/>
      <stop offset="1" stop-color="#1650e0"/>
    </linearGradient>
  </defs>
  <g transform="translate(0 0) scale(0.3125)">
    <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#tile)"/>
    <g fill="none" stroke="#fff" stroke-width="42">
      <circle cx="196" cy="256" r="83"/>
      <circle cx="316" cy="256" r="83"/>
    <path d="M256 233.73A64 64 0 0 1 256 278.27A64 64 0 0 1 256 233.73Z" fill="#fff" stroke="none"/>
    </g>
  </g>
  <text x="184" y="86" fill="#2f6bff" font-family="'Inter Tight', 'Segoe UI', Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="-1.9">JConnect</text>
  <text x="186" y="128" fill="#6b7280" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="500">Open. Connect. Work.</text>
</svg>
